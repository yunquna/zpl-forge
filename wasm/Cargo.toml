[package]
name = "yqn-zpl-forge-wasm"
version = "0.3.2-yqn.5"
edition = "2024"
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
repository = "https://github.com/yunquna/zpl-forge"
description = "Byte-oriented ZPL rendering for JavaScript and Worker runtimes"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zpl-forge = { path = "..", features = ["shaped-pdf"] }
wasm-bindgen = "=0.2.128"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
